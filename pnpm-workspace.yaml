autoInstallPeers: true
catalogMode: prefer
nodeLinker: hoisted
shamefullyHoist: true
shellEmulator: true
supportedArchitectures:
  cpu: [x64, arm64]
  os: [linux, darwin, win32]
trustPolicy: no-downgrade
# These releases predate provenance but sit after a later-published build that has it.
# pnpm treats that as a trust downgrade. They are already in the lockfile.
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

packages:
  - apps/*
  - packages/*

catalogs:
  dev:
    '@antfu/eslint-config': ^6.6.1
    '@commitlint/cli': ^20.2.0
    '@commitlint/config-conventional': ^20.2.0
    '@nuxt/devtools': ^3.4.2
    '@nuxt/fonts': ^0.14.0
    '@nuxtjs/mcp-toolkit': ^0.24.1
    '@nuxtjs/seo': ^5.3.16
    bumpp: ^10.3.2
    drizzle-kit: 0.31.8
    eslint: ^9.39.5
    husky: ^9.1.7
    lint-staged: ^16.2.7
    nuxt: ^4.6.1
    nuxt-auth-utils: ^0.5.26
    typescript: ^5.9.3
    vite: ^8.3.4
    vue-tsc: ^3.1.8
  integrations:
    '@iconify-json/tabler': ^1.2.27
    '@iconify/utils': ^2.3.0
    '@nuxt/icon': ^2.2.0
    '@paralleldrive/cuid2': 2.2.2
    '@vueuse/core': ^14.1.0
    '@vueuse/nuxt': ^14.1.0
    drizzle-cuid2: 2.1.0
    drizzle-orm: 0.45.1
    maplibre-gl: ^5.9.0
    pg: 8.16.3
    pmtiles: ^4.3.0
    reka-ui: ^2.5.1
    sharp: ^0.35.4
    vue: ^3.5.43
    zod: ^4.1.13
  test:
    '@testcontainers/postgresql': ^11.10.0
    '@vitejs/plugin-vue': ^6.0.10
    '@vitest/browser-playwright': ^4.1.11
    '@vitest/coverage-v8': ^4.1.11
    '@vue/test-utils': ^2.4.6
    happy-dom: ^20.0.10
    playwright: ^1.57.0
    vitest: ^4.1.11
    vitest-browser-vue: ^2.0.1
  types:
    '@types/node': ^25.0.0
    '@types/pg': 8.16.0

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - cpu-features
  - esbuild
  - msw
  - protobufjs
  - ssh2
  - vue-demi

onlyBuiltDependencies:
  - better-sqlite3
  - sharp
