name: CI

on:
  push:
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '!.github/workflows/ci.yml'
    branches:
      - main
  # No path filter on pull requests: every PR head gets build and docker,
  # so the checks a merge waits for always exist.
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k39
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d k39"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository checks
        run: |
          git fetch origin main
          pnpm run check:repo

      - name: Format (read-only)
        run: pnpm run format:check

      - name: Lint (Oxlint and Vue templates)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/k39_test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Copy .output out of the workspace so Node cannot resolve modules from
      # the repo node_modules. This is the failure mode of the Docker image.
      - name: Smoke standalone SSR
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/k39
          NUXT_SESSION_PASSWORD: smoke-test-session-password-32chars
        run: bash apps/web-app/scripts/smoke-ssr.sh

  # Dokploy builds this same Dockerfile. A JS-only CI job does not catch a
  # broken image (pnpm on Alpine, filter flags, missing migrations).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build web app image
        run: docker build -f docker/web-app/Dockerfile .
