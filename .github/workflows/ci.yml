name: CI

on:
  push:
    paths-ignore:
      - "*.md"
      - ".github/**"
      - "!.github/workflows/ci.yml"
    branches:
      - main
      - chore/agent-loop-baseline
  # No path filter on pull requests: every PR head gets build and docker,
  # so the checks a merge waits for always exist.
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k39
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d k39"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full verification
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/k39_test
        run: |
          git fetch origin main
          pnpm run check:full
          git diff --exit-code

      - name: Build
        run: pnpm run build

      # Copy .output out of the workspace so Node cannot resolve modules from
      # the repo node_modules. This is the failure mode of the Docker image.
      - name: Smoke standalone SSR
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/k39
          NUXT_SESSION_PASSWORD: smoke-test-session-password-32chars
        run: bash apps/web-app/scripts/smoke-ssr.sh

  # Dokploy builds this same Dockerfile. A JS-only CI job does not catch a
  # broken image (pnpm on Alpine, filter flags, missing migrations).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build web app image
        run: docker build -f docker/web-app/Dockerfile .

  agent-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: k39_a01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d k39_a01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/k39_a01
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/k39_a01_test
      NUXT_TELEMETRY_DISABLED: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: ${{ runner.temp }}/k39-a01-empty-store
    steps:
      - name: Checkout measurement helpers
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Host and cache state
        run: |
          test ! -e /etc/profile.d/k39.sh
          test ! -e /exec-daemon
          test ! -e "$npm_config_store_dir"
          node -e 'const os=require("node:os"); console.log("A01_HOST "+JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,cpus:os.availableParallelism(),cpu:os.cpus()[0].model,memoryBytes:os.totalmem(),pnpmStore:"empty at start",remoteCache:"uncontrolled",toolProvisioning:"outside checkout-to-ready timer"}))'
          pnpm --version
      - name: Checkout baseline
        uses: actions/checkout@v5
        with:
          ref: 73bb36eda23d7b6abff1ad4242c42e30f6e38c0c
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - name: Cold-store install
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Portable toolchain
        working-directory: baseline
        run: node "$GITHUB_WORKSPACE/scripts/env/check-toolchain.mjs" --json
      - name: First and warm dev readiness
        working-directory: baseline
        run: node "$GITHUB_WORKSPACE/docs/reviews/2026-10-23-agent-loop/measure-start.mjs"
      - name: Warm install
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Representative quick loop
        working-directory: baseline
        env:
          K39_CHECK_TIMINGS: "1"
        run: |
          git update-ref refs/remotes/origin/main ddc17b6b0a2a16b97c08467cc7bc45cf120439bf
          node "$GITHUB_WORKSPACE/scripts/check-quick.mjs"
      - name: Baseline full check
        working-directory: baseline
        run: |
          pnpm run check:full
          git diff --exit-code
      - name: Baseline web build
        working-directory: baseline
        run: pnpm --filter @k39/web-app build
      - name: Baseline standalone SSR
        working-directory: baseline
        run: bash apps/web-app/scripts/smoke-ssr.sh
