<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D8DE"/><stop offset=".65" stop-color="#EFE4CF"/><stop offset="1" stop-color="#F3E3C3"/></linearGradient>
 <pattern id="brick" width="36" height="18" patternUnits="userSpaceOnUse">
  <rect width="36" height="18" fill="#A3402A"/>
  <path d="M0 0.5H36M0 9.5H36M0.5 0V9M18.5 9V18" stroke="#7A2E1F" stroke-width="1.4" opacity=".55"/>
